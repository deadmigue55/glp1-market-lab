name: Nightly forecast

on:
  schedule:
    # 22:30 UTC, Monday to Friday: after the US close in both summer and winter time
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

# Never two runs at once: both would append to the same ledger
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  forecast:
    name: Fetch, forecast, append to the public ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Nightly run
        run: uv run glp1 nightly

      - name: Commit the new forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts site/public/data
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "Nightly forecast $(date -u +%F)"
            git push
          fi
