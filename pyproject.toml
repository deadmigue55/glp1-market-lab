[project]
name = "glp1-market-lab"
version = "0.1.0"
description = "How GLP-1 news moves pharma, medtech and food stocks, and a forecast that updates with the news."
readme = "README.md"
license = "MIT"
authors = [{ name = "Miguel Vilchis", email = "migue.vilchis@ciencias.unam.mx" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
glp1 = "glp1.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glp1"]

# ── Linting & formatting ──
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import sorting
  "B",        # bugbear (likely bugs)
  "UP",       # modern Python syntax
  "NPY",      # NumPy-specific rules
  "PD",       # pandas-specific rules
  "SIM",      # simplifications
  "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E501"]
"src/glp1/checks.py" = ["E501"]  # SQL strings and messages read better on long lines
"src/glp1/warehouse.py" = ["E501"]
"src/glp1/doctor.py" = ["E501"]  # source URLs

# ── Tests ──
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network'"
markers = [
  "network: needs internet access (deselected by default; run with -m network)",
  "slow: long-running test",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]
